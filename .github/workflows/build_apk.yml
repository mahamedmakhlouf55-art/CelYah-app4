name: Build CelYah APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_apk.yml'

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter environment
        run: flutter --version

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name celyah .

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --install "platforms;android-37"

      - name: Set Android compileSdk to 37
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              s, count = re.subn(r'(?m)^(\s*)compileSdk\s*=\s*[^\n]+', r'\g<1>compileSdk = 37', s, count=1)
          else:
              p = Path('android/app/build.gradle')
              if not p.exists():
                  raise SystemExit('Android Gradle app file not found')
              s = p.read_text()
              s, count = re.subn(r'(?m)^(\s*)compileSdk(?:Version)?\s+[^\n]+', r'\g<1>compileSdk 37', s, count=1)
          if count != 1:
              raise SystemExit('Could not locate compileSdk setting in ' + str(p))
          p.write_text(s)
          print('Updated', p, 'to compileSdk 37')
          PYCODE

      - name: Fix Android launch background
        run: |
          mkdir -p android/app/src/main/res/drawable-v21
          cat > android/app/src/main/res/drawable-v21/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#0B0915" />
                  </shape>
              </item>
          </layer-list>
          XML
          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-v21/launch_background.xml android/app/src/main/res/drawable/launch_background.xml

      - name: Install Flutter packages
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CelYah-Robot-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
